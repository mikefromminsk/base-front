<div class="dialog flex col">
    <div class="row acc ph16 pv8 gap8">
        <div class="flex text3">Плагины</div>
        <img class="img-white img24 ripple" src="icon/close.svg" ng-click="close()">
    </div>

    <div class="flex col scroll p16 gap8">
        <input ng-model="query" ng-change="search(query)" placeholder="Поиск">

        <div class="row acc p16 r16 back-gray100 gap8"
             ng-repeat="item in pluginList track by item.name">
            <div class="flex col gap4">
                <div class="text4">{{item.title}}</div>
                <div class="text5 text-gray">{{item.name}}</div>
                <div class="text5 text-gray" ng-if="item.description">{{item.description}}</div>
            </div>
            <input type="checkbox" ng-checked="plugins.has(item.name)" ng-click="plugins.toggle(item.name)">
        </div>

        <div class="text5 text-gray" ng-if="!catalog.length">Ничего не найдено</div>
    </div>
</div>
