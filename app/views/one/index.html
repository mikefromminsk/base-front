<div class="flex col">
    <div class="row acc ph16 pv8 gap8">
        <div class="flex text3">{{info.title}}</div>
    </div>

    <div class="flex col scroll p16 gap8">
        <div class="row acc p16 r16 back-gray100 gap8"
             ng-repeat="item in info.items track by item.title">
            <div class="flex text4">{{item.title}}</div>
            <div class="text4 bold">{{formatCount(item.value)}}</div>
        </div>
    </div>
</div>
