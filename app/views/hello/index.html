<div class="dialog flex col">
    <div class="row acc ph16 pv8 gap8">
        <div class="flex text3 hello-title">Плагин «hello»</div>
        <img class="img-white img24 ripple" src="icon/close.svg" ng-click="close()">
    </div>

    <div class="flex col scroll p16 gap8">
        <div class="row acc p16 r16 back-gray100 gap8">
            <div class="flex text4">Параметр id</div>
            <div class="text4 bold">{{params.id || '-'}}</div>
        </div>

        <div class="row acc p16 r16 back-gray100 gap8"
             ng-repeat="item in items track by item.title">
            <div class="flex text4">{{item.title}}</div>
            <div class="text4 bold">{{formatCount(item.value)}}</div>
        </div>

        <button class="button2" ng-click="openAsDialog($event)">Открыть этот же плагин диалогом</button>
    </div>
</div>
