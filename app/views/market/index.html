<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Маркет плагинов</title>
    <style>
        body { background: #111; color: #eee; font-family: sans-serif; padding: 24px; }
        h1 { font-size: 20px; }
        .item { padding: 10px 0; border-bottom: 1px solid #333; }
        .title { font-size: 15px; }
        .meta { color: #888; font-size: 12px; }
    </style>
</head>
<body>

<h1>Маркет плагинов</h1>
<div id="list">Загрузка…</div>

<script>
fetch('../../api/plugins.json?q=').then(function (result) {
    return result.json()
}).then(function (list) {
    var html = list.map(function (item) {
        var meta = item.name + ' · ' + (item.path || 'views/' + item.name)
        if (item.requires) meta += ' · требует: ' + item.requires.join(', ')
        if (item.version) meta += ' · версия ' + item.version
        return '<div class="item"><div class="title">' + (item.title || item.name) + '</div>' +
            '<div class="meta">' + meta + '</div></div>'
    }).join('')
    document.getElementById('list').innerHTML = html
})
</script>

</body>
</html>
